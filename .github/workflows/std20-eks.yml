name: GitOps ArgoCD CICD Pipeline

on:
  push:
    branches:
      - main

# 2. 작업 정의
jobs:
  build-and-update:
    runs-on: ubuntu-latest                        # 실제 작업 주체
    permissions:
      contents: write                             # runs-on에 정의된 서버가 깃에 업로드 된 파일을 쓸 수 있는 권한(deployment.yaml의 image 태그를 업데이트 하기 위함.)
    steps:
      - name: 소스코드 체크아웃                     # 깃에 push 된 파일을 서버로 복사
        uses: actions/checkout@v4


      - name: Docker Hub 로그인
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      
      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./nginx/Dockerfile
          push: true
          #(중요) 이미지명 정의(태그 자동 완성)
          tags: ${{ secrets.DOCKER_USERNAME }}/nginx:${{ github.sha }}


      - name: 쿠버네티스 파일의 이미지 태그 갱신 및 Git push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          sed -i "s|image: ${{ secrets.DOCKER_USERNAME }}/nginx:.*|image: ${{ secrets.DOCKER_USERNAME }}/nginx:${{ github.sha }}|g" ./k8s/std20-deployment.yaml

          git add ./k8s/std20-deployment.yaml
          git commit -m "Update nginx image tag to ${{ github.sha }}"
          git push

